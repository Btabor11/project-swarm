# Copy to .github/workflows/ci-diag.yml in the target project.
name: CI diagnostic
on:
  push:
    branches: ['diag-*']

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        # Edit this single OS to match the failing CI platform.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verbose test timings
        continue-on-error: true
        run: npx vitest run --reporter=verbose --testTimeout=30000

